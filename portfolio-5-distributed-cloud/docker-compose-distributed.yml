version: '3.8'

# ============================================================================
# MIT 8103: Advanced Database Systems - Portfolio 5
# Student Name: Peace Ekoh | Student ID: 301866431
# Case Study: NovaMart Retail Logistics & Storefront
# File: docker-compose-distributed.yml
# Topology: Distributed Primary-Replica MySQL Cluster with In-Memory Cache
# ============================================================================

networks:
  novamart-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql-master-data:
  mysql-replica-data:
  redis-data:

services:
  # --------------------------------------------------------------------------
  # 1. PRIMARY WRITER NODE (Master)
  # Handles all transactional writes: Orders, Payments, Stock Decrements
  # --------------------------------------------------------------------------
  mysql-primary:
    image: mysql:8.0.30
    container_name: novamart-mysql-primary
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword2026!
      MYSQL_DATABASE: novamart_db
      MYSQL_USER: novamart_app
      MYSQL_PASSWORD: AppPassword2026!
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-do-db=novamart_db
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --innodb-flush-log-at-trx-commit=1
      --sync-binlog=1
    ports:
      - "3307:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
    networks:
      - novamart-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPassword2026!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # 2. READ REPLICA NODE (Read-Only)
  # Offloads heavy read traffic: Catalog browsing, search, reporting
  # --------------------------------------------------------------------------
  mysql-replica:
    image: mysql:8.0.30
    container_name: novamart-mysql-replica
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword2026!
    command: >
      --server-id=2
      --relay-log=mysql-relay-bin
      --log-bin=mysql-bin
      --read-only=ON
      --super-read-only=ON
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    ports:
      - "3308:3306"
    volumes:
      - mysql-replica-data:/var/lib/mysql
    networks:
      - novamart-net
    depends_on:
      mysql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPassword2026!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # 3. DISTRIBUTED IN-MEMORY CACHE (Redis)
  # Manages ephemeral user cart sessions and high-frequency stock cache
  # --------------------------------------------------------------------------
  redis-cache:
    image: redis:7.0-alpine
    container_name: novamart-redis-cache
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - novamart-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
